<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The sidebar's brand mark as a tab icon: the same 140deg gradient
       (--accent #1c4ed8 to --brand-to #6d3fd4) and the same letters. There
       was no icon at all, so every page logged a 404 for /favicon.ico and every
       tab showed a blank square. Found on the September 2026 walk. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4ed8"/>
      <stop offset="1" stop-color="#6d3fd4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <text x="16" y="21" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fff">GF</text>
</svg>
